services:
  mstodo_web:
    build: .
    container_name: mstodo_web
    restart: always
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    environment:
      - TZ=Asia/Seoul
      - MS_CLIENT_ID=
      - MS_CLIENT_SECRET=
    command: >
      sh -c "gunicorn --bind 0.0.0.0:5001 --timeout 600 app:app & 
             python3 sync_worker.py"

  # Claude 연동용 MCP 서버 (mstodo_web REST API를 호출)
  mstodo_mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mstodo_mcp
    restart: always
    env_file: .env
    environment:
      - TZ=Asia/Seoul
      - TODO_API_BASE=http://mstodo_web:5001
      - MCP_PORT=8095
      - PUBLIC_URL=https://todo.b-612.kr
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - ./mcp_server.py:/app/mcp_server.py:ro
      - ./oauth_provider.py:/app/oauth_provider.py:ro
      - ./mcp_data:/data
    depends_on:
      - mstodo_web
    networks:
      - default
      - npm_network

networks:
  npm_network:
    external: true
