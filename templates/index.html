<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 | Microsoft To Do</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="할 일">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #F7F6F2;
            --surface: #FFFFFF;
            --surface-2: #EFEDE6;
            --border: #E3E1DA;
            --border-2: #C8C5BC;
            --text-1: #1A1917;
            --text-2: #5C5751;
            --text-3: #9B9790;
            --accent: #C96442;
            --accent-bg: #FAF0EB;
            --accent-hover: #B55A38;
            --blue: #3A6FBF;
            --blue-bg: #EEF3FB;
            --green: #367A52;
            --green-bg: #EAF4EF;
            --red: #C04038;
            --red-bg: #FAEAEA;
            --amber: #A67530;
            --amber-bg: #FBF4E6;
        }
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        /* Weather Effects */
        #weather-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .rain {
            position: absolute;
            background: linear-gradient(to bottom, rgba(100, 150, 220, 0.0), rgba(100, 150, 230, 0.7));
            width: 2px; height: 20px; top: -20px;
            border-radius: 0 0 2px 2px;
            animation: fall linear infinite;
        }
        .storm-rain {
            position: absolute;
            background: linear-gradient(to bottom, rgba(80, 120, 210, 0.0), rgba(80, 120, 210, 0.8));
            width: 2px; height: 22px; top: -25px;
            border-radius: 0 0 2px 2px;
            animation: fall-storm-2 linear infinite;
        }
        .snow {
            position: absolute;
            background: rgba(200, 225, 255, 0.85);
            border-radius: 50%; top: -10px;
            box-shadow: 0 0 3px rgba(180, 210, 255, 0.5);
            animation: fall linear infinite;
        }
        @keyframes fall { to { transform: translateY(110vh); } }
        @keyframes fall-storm-1 {
            from { transform: translateY(-25px) translateX(0); }
            to   { transform: translateY(110vh) translateX(20px); }
        }
        @keyframes fall-storm-2 {
            from { transform: translateY(-25px) translateX(0); }
            to   { transform: translateY(110vh) translateX(38px); }
        }
        @keyframes fall-storm-3 {
            from { transform: translateY(-25px) translateX(0); }
            to   { transform: translateY(110vh) translateX(55px); }
        }
        .sparkle {
            position: absolute;
            background: rgba(255, 210, 80, 0.6); border-radius: 50%;
            opacity: 0; animation: sparkle-anim 3s infinite linear;
        }
        @keyframes sparkle-anim {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1); opacity: 0.7; }
        }
        .cloud-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(160, 155, 148, 0.14);
            opacity: 0; transition: opacity 2s ease;
        }
        .cloud-overlay.active { opacity: 1; }
        .cloud-overlay.heavy { background: rgba(110, 105, 98, 0.20); }
        .mist-overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 65%;
            background: linear-gradient(to top, rgba(235,233,228,0.72) 0%, rgba(235,233,228,0.15) 60%, rgba(235,233,228,0) 100%);
            opacity: 0; transition: opacity 3s ease;
        }
        .mist-overlay.active { opacity: 1; }
        .sun-glare {
            position: absolute;
            top: 0; right: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse 60% 55% at 85% 0%, rgba(255,210,80,0.22) 0%, rgba(255,190,60,0.10) 40%, rgba(200,160,80,0.03) 65%, transparent 100%);
            opacity: 0; transition: opacity 2s ease;
        }
        .sun-glare.active { opacity: 1; animation: sun-pulse 5s ease-in-out infinite; }
        @keyframes sun-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .thunder-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10;
        }
        .flash-active { animation: flash-anim 0.6s ease-out; }
        @keyframes flash-anim {
            0% { opacity: 0; } 8% { opacity: 0.35; } 16% { opacity: 0; } 24% { opacity: 0.45; } 100% { opacity: 0; }
        }

        /* Task cards — flat list style */
        .task-card {
            transition: background 0.1s;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .task-card:hover { background: var(--surface-2); }
        #task-list > .task-card:first-child,
        #completed-tasks-container > .task-card:first-child { border-top: 1px solid var(--border); }
        .important-task { border-left: 2px solid var(--amber); padding-left: calc(1rem - 2px); }
        .overdue-task   { border-left: 2px solid var(--red);   padding-left: calc(1rem - 2px); }
        .today-task     { border-left: 2px solid var(--green); padding-left: calc(1rem - 2px); }
        .tomorrow-task  { border-left: 2px solid var(--blue);  padding-left: calc(1rem - 2px); }

        .completed { text-decoration: line-through; color: var(--text-3); }
        .fade-out { opacity: 0; transition: all 0.3s ease; }

        .chip { transition: all 0.1s; cursor: pointer; white-space: nowrap; flex-shrink: 0; border-radius: 3px; }
        .chip.active { background-color: var(--text-1) !important; color: white !important; border-color: var(--text-1) !important; }

        .sidebar-item { transition: background 0.1s; cursor: pointer; border-radius: 4px; white-space: nowrap; margin-bottom: 1px; }
        .sidebar-item.active { background-color: var(--accent-bg) !important; color: var(--accent) !important; }
        .sidebar-item:hover:not(.active) { background-color: var(--surface-2); }

        .group-header { cursor: pointer; user-select: none; }
        .group-content { transition: max-height 0.25s ease-out; overflow: hidden; }
        .group-content.collapsed { max-height: 0 !important; }
        .rotate-icon { transition: transform 0.15s; }
        .collapsed .rotate-icon { transform: rotate(-90deg); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .sidebar { height: calc(100vh - 3rem); position: sticky; top: 1.5rem; }

        [contenteditable="true"]:focus {
            outline: none;
            background: var(--surface-2);
            border-radius: 3px;
            box-shadow: 0 0 0 2px var(--accent);
            padding: 0 3px;
            overflow: visible;
            white-space: normal;
        }

        .star-btn:hover i { transform: scale(1.1); }
        .due-date-btn { opacity: 0; transition: opacity 0.1s; }
        .task-card:hover .due-date-btn { opacity: 1; }

        #date-picker-popup {
            position: absolute;
            z-index: 50;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 10px;
            width: 168px;
        }
        </style>
        </head>

        </div>

<body class="p-4 md:p-6">

        <div class="bg-white/80 backdrop-blur-sm border border-[#E3E1DA] rounded-lg px-3.5 py-2.5 shadow-sm flex flex-col gap-1">

                    </div>

                                <input type="text" id="add-group-input" placeholder="새 그룹 이름" class="w-full text-[12px] px-2.5 py-1.5 border border-[#E3E1DA] rounded focus:outline-none focus:border-[#C96442] mb-2" onkeydown="if(event.key === 'Enter') confirmAddGroup()">

                            <a href="javascript:void(0)" onclick="selectList(null)" class="flex items-center space-x-2">

                                </div>
                                <div class="flex flex-col">
                                    <h1 class="text-[13px] font-bold text-[#1A1917] leading-none">To-Do</h1>
                                    <span id="mobile-clock" class="text-[9px] text-[#9B9790] mt-0.5"></span>
                                </div>

                                <i class="fas fa-cog text-sm"></i>

                            <i class="fas fa-sync-alt text-[9px]" id="refresh-icon-mobile"></i>

                <div id="task-input-wrapper" class="relative flex mb-5 group">

    <script>
        let currentListId = null;
        let isProcessing = false;
        let cachedTasks = [];
        let allLists = [];
        let userGroups = [];
        let _sortableInstances = []; // track all Sortable instances so we can destroy them on re-render
        let _sortableBusy = false;   // prevent concurrent onEnd from firing on the same drag

        // Shared onEnd handler for all Sortable instances (group reorder + list move)
        async function _onSortableEnd() {
            if (_sortableBusy) return;
            _sortableBusy = true;
            try {
                const sidebar = document.getElementById('sidebar-list');
                const groupContents = sidebar.querySelectorAll('.group-content');

                // Build updated groups from current DOM order
                let updatedGroups = [];
                const seenListIds = new Set(); // deduplicate: each list can only appear in one group

                groupContents.forEach(content => {
                    const idx = content.dataset.groupIdx;
                    const listIds = Array.from(content.children)
                        .map(c => c.dataset.listId)
                        .filter(id => {
                            if (!id || seenListIds.has(id)) return false;
                            seenListIds.add(id);
                            return true;
                        });

                    updatedGroups.push({
                        name: userGroups[idx].name,
                        collapsed: userGroups[idx].collapsed,
                        lists: listIds
                    });
                });

                userGroups = updatedGroups;
                await saveGroups();
                renderSidebar();
            } finally {
                _sortableBusy = false;
            }
        }
        async function fetchLists() {
            try {
                const [listsResp, groupsResp] = await Promise.all([
                    fetch('/api/lists'),
                    fetch('/api/groups')
                ]);
                allLists = await listsResp.json();
                const groupsData = await groupsResp.json();
                userGroups = groupsData.groups || [];
                
                // Process ungrouped lists: auto-group them into '기타 목록'
                // Also clean up: remove stale list IDs (deleted lists) from all groups,
                // and remove IDs from '기타 목록' that were explicitly moved to another group.
                const validListIds = new Set(allLists.map(l => l.id));

                // First pass: clean stale IDs from every group
                userGroups.forEach(g => {
                    g.lists = g.lists.filter(id => validListIds.has(id));
                });

                // Re-compute which IDs are already placed (after cleanup)
                const groupedListIds = new Set(userGroups.flatMap(g => g.lists));
                const ungroupedListIds = allLists.map(l => l.id).filter(id => !groupedListIds.has(id));
                
                if (ungroupedListIds.length > 0) {
                    let otherGroup = userGroups.find(g => g.name === '기타 목록');
                    if (!otherGroup) {
                        otherGroup = { name: '기타 목록', lists: [], collapsed: false };
                        userGroups.push(otherGroup);
                    }
                    const existingInOther = new Set(otherGroup.lists);
                    ungroupedListIds.forEach(id => {
                        if (!existingInOther.has(id)) otherGroup.lists.push(id);
                    });
                    await saveGroups();
                }

                renderSidebar();
                renderMobileChips();

                // Always start with All Tasks (null) or restore currentListId if navigating
                selectList(currentListId);
                
                // Trigger initial sync for lists and tasks in the background
                triggerSync();
            } catch (err) { console.error('Failed to fetch lists or groups', err); }
        }

        function renderSidebar() {
            // Destroy all existing Sortable instances before wiping DOM
            _sortableInstances.forEach(s => s.destroy());
            _sortableInstances = [];

            const container = document.getElementById('sidebar-list');
            container.innerHTML = '';

            // Grouped Lists
            userGroups.forEach((group, groupIdx) => {
                const groupEl = document.createElement('div');
                groupEl.className = `mb-2 ${group.collapsed ? 'collapsed' : ''}`;
                
                const header = document.createElement('div');
                header.id = `side-chip-group_${groupIdx}`;
                header.className = `sidebar-item group-header group flex items-center justify-between px-3 py-1.5 text-[#5C5751] font-medium text-[13px] ${currentListId === 'group_' + groupIdx ? 'active' : ''}`;
                header.style.cursor = 'pointer';
                header.onclick = (e) => {
                    if (e.target.closest('.action-btn') || e.target.isContentEditable) return;
                    selectList(`group_${groupIdx}`);
                };
                header.innerHTML = `
                    <div class="flex items-center space-x-2 flex-grow min-w-0">
                        <div class="action-btn cursor-pointer flex items-center justify-center w-4 h-4 opacity-40 hover:opacity-100 flex-shrink-0 group-[.active]:opacity-100" onclick="toggleGroup(${groupIdx}); event.stopPropagation();">
                            <i class="fas fa-chevron-down text-xs rotate-icon ${group.collapsed ? 'collapsed' : ''}"></i>
                        </div>
                        <span class="group-name text-[13px] truncate outline-none"
                              onkeydown="if(event.key === 'Enter') { event.preventDefault(); this.blur(); }">${group.name}</span>
                    </div>
                    <div class="flex items-center space-x-0.5 flex-shrink-0">
                        <button onclick="editGroup(${groupIdx}, this); event.stopPropagation();" class="action-btn opacity-0 group-hover:opacity-100 hover:text-[#C96442] transition-all p-1" title="이름 수정">
                            <i class="fas fa-edit text-xs"></i>
                        </button>
                        <button onclick="deleteGroup(${groupIdx}); event.stopPropagation();" class="action-btn opacity-0 group-hover:opacity-100 hover:text-[#C04038] transition-all p-1" title="그룹 삭제">
                            <i class="fas fa-times text-xs"></i>
                        </button>
                    </div>
                `;

                const content = document.createElement('div');
                content.className = `group-content mt-0.5 ${group.collapsed ? 'collapsed' : ''}`;
                content.dataset.groupIdx = groupIdx;

                group.lists.forEach(listId => {
                    const list = allLists.find(l => l.id === listId);
                    if (list) {
                        content.appendChild(createSidebarItem(list));
                    }
                });

                groupEl.appendChild(header);
                groupEl.appendChild(content);
                container.appendChild(groupEl);

                initSortable(content, groupIdx);
            });

            // Initialize Group Reordering Sortable
            _sortableInstances.push(new Sortable(container, {
                animation: 150,
                handle: '.group-header',
                ghostClass: 'bg-slate-50',
                onEnd: _onSortableEnd
            }));
        }

        async function editGroup(idx, btn) {
            const header = btn.closest('.group-header');
            const nameSpan = header.querySelector('.group-name');
            nameSpan.contentEditable = true;
            nameSpan.focus();
            
            const range = document.createRange();
            range.selectNodeContents(nameSpan);
            range.collapse(false);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            nameSpan.onblur = async () => {
                nameSpan.contentEditable = false;
                await renameGroup(idx, nameSpan);
            };
        }

        async function renameGroup(idx, el) {
            const newName = el.innerText.trim();
            if (newName && newName !== userGroups[idx].name) {
                userGroups[idx].name = newName;
                await saveGroups();
            }
        }

        function createSidebarItem(list) {
            const item = document.createElement('div');
            item.id = `side-chip-${list.id}`;
            item.dataset.listId = list.id;
            item.className = `sidebar-item group flex items-center px-3 py-1.5 text-[#5C5751] font-medium text-[13px] ${currentListId === list.id ? 'active' : ''}`;

            let icon = 'fa-list-ul';
            if (list.wellKnownName === 'defaultList') icon = 'fa-inbox';
            else if (list.wellKnownName === 'flaggedEmails') icon = 'fa-envelope';

            item.innerHTML = `
                <i class="fas ${icon} mr-2.5 text-xs opacity-40 group-[.active]:opacity-100"></i>
                <span class="truncate">${list.name}</span>
            `;
            item.onclick = () => selectList(list.id);
            return item;
        }

        function toggleAddGroupPopup() {

                popup.classList.remove('hidden');

        async function confirmAddGroup() {

                await saveGroups();

        async function deleteGroup(idx) {

                userGroups.splice(idx, 1);

        async function toggleGroup(idx) {
            userGroups[idx].collapsed = !userGroups[idx].collapsed;
            await saveGroups();
            renderSidebar();
        }

        async function saveGroups() {
            await fetch('/api/groups', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    groups: userGroups
                })
            });
        }

        let activeDatePicker = { listId: null, taskId: null };

        function showDueDateMenu(btn, listId, taskId, currentDate = null) {
            const popup = document.getElementById('date-picker-popup');
            const rect = btn.getBoundingClientRect();
            
            activeDatePicker = { listId, taskId };
            const dateValue = currentDate || new Date().toISOString().split('T')[0];
            
            // 텍스트박스에 요일 포함 표시
            document.getElementById('date-input-field').value = formatDate(dateValue);
            // 숨겨진 피커에는 YYYY-MM-DD만 저장

            popup.style.top = `${rect.bottom + window.scrollY + 5}px`;
            popup.style.left = `${rect.left + window.scrollX - 50}px`;
            popup.classList.remove('hidden');

            // Close when clicking outside
            setTimeout(() => {
                const closeHandler = (e) => {
                    if (!popup.contains(e.target) && !btn.contains(e.target)) {
                        closeDatePicker();
                        document.removeEventListener('click', closeHandler);
                    }
                };
                document.addEventListener('click', closeHandler);
            }, 10);
        }

        function handleHiddenDateChange(value) {
            if (value) {
                document.getElementById('date-input-field').value = formatDate(value);
            }
        }

        function closeDatePicker() {
            document.getElementById('date-picker-popup').classList.add('hidden');
        }

        async function applyDueDate() {
            const date = document.getElementById('hidden-date-picker').value;
            if (date) {
                await setDueDate(activeDatePicker.listId, activeDatePicker.taskId, date);
                closeDatePicker();
            }
        }

        async function clearDueDate() {
            await setDueDate(activeDatePicker.listId, activeDatePicker.taskId, null);
            closeDatePicker();
        }

        function updateTaskInputState() {
            const canAdd = currentListId && !currentListId.startsWith('group_');
            const input = document.getElementById('task-input');
            const btn = document.getElementById('task-add-btn');
            if (!input || !btn) return;
            if (canAdd) {
                input.disabled = false;
                input.placeholder = '할 일 추가...';
                input.classList.remove('bg-[#F5F4F0]', 'cursor-not-allowed', 'opacity-60');
                input.classList.add('bg-white', 'focus:border-[#C96442]', 'placeholder:text-[#9B9790]');
                btn.disabled = false;
                btn.classList.remove('bg-[#D4CFC8]', 'text-[#9B9790]', 'cursor-not-allowed', 'opacity-60');
                btn.classList.add('bg-[#C96442]', 'hover:bg-[#B55A38]', 'text-white');
            } else {
                input.disabled = true;
                input.placeholder = '목록을 선택하여 할 일을 추가하세요';
                input.classList.add('bg-[#F5F4F0]', 'cursor-not-allowed', 'opacity-60');
                input.classList.remove('bg-white', 'focus:border-[#C96442]', 'placeholder:text-[#9B9790]');
                btn.disabled = true;
                btn.classList.add('bg-[#D4CFC8]', 'text-[#9B9790]', 'cursor-not-allowed', 'opacity-60');
                btn.classList.remove('bg-[#C96442]', 'hover:bg-[#B55A38]', 'text-white');

        function selectList(id) {
            currentListId = id;

            // Update UI for All Tasks
            const allBtn = document.getElementById('all-tasks-btn');
            const allChip = document.getElementById('all-tasks-chip');
            if (id === null) {
                if (allBtn) allBtn.classList.add('active');
                if (allChip) allChip.classList.add('active');
            } else {
                if (allBtn) allBtn.classList.remove('active');
                if (allChip) allChip.classList.remove('active');
            }

            document.querySelectorAll('.chip').forEach(c => {
                if (c.id === 'all-tasks-chip') return;
                c.classList.remove('active');
            });
            const activeChip = document.getElementById(`chip-${id}`);
            if (activeChip) {
                activeChip.classList.add('active');
                activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            document.querySelectorAll('.sidebar-item').forEach(c => c.classList.remove('active'));
            const activeSide = document.getElementById(`side-chip-${id}`);
            if (activeSide) activeSide.classList.add('active');
            
            updateTaskInputState();
            fetchTasks();
            triggerSync(); // Background sync on every navigation
        }

        function getQueryForCurrentSelection() {
            if (!currentListId) return '';
            if (currentListId.startsWith('group_')) {
                const groupIdx = parseInt(currentListId.split('_')[1]);
                const group = userGroups[groupIdx];
                if (group && group.lists.length > 0) {
                    return `?list_ids=${group.lists.join(',')}`;
                }
                return `?list_ids=none`; // Empty group
            }
            return `?list_id=${currentListId}`;
        }

        async function triggerSync(force = false) {
            const icons = [document.getElementById('refresh-icon-mobile'), document.getElementById('refresh-icon-desktop')];
            icons.forEach(i => i && i.classList.add('fa-spin'));

            try {
                let query = getQueryForCurrentSelection();
                // For triggerSync, if it's a group, we might want to sync the specific lists. 
                // Currently backend doesn't support list_ids for sync, so we just sync all or the specific list.
                let syncUrl = `/api/sync/all`;
                if (currentListId && !currentListId.startsWith('group_')) {
                    syncUrl += `?list_id=${currentListId}`;
                }
                if (force) syncUrl += (syncUrl.includes('?') ? '&' : '?') + 'force=1';

                const response = await fetch(syncUrl);
                const result = await response.json();
                if (result.has_changes || force) {
                    fetchTasks(true);
                }
            } catch (err) {
                console.error('Sync failed', err);
            } finally {
                icons.forEach(i => i && i.classList.remove('fa-spin'));
            }
        }
        
        async function fetchTasks(silent = false) {
            const loading = document.getElementById('loading');
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');

            let loadingTimeout = null;
            if (!silent) {
                loadingTimeout = setTimeout(() => {
                    loading.classList.remove('hidden');
                    taskList.classList.add('hidden');
                    emptyState.classList.add('hidden');
                }, 50); // Delay spinner for 50ms (faster than flicker)
            }

            try {
                const query = getQueryForCurrentSelection();
                const url = `/api/tasks${query}`;
                const response = await fetch(url);
                cachedTasks = await response.json();
                
                if (loadingTimeout) clearTimeout(loadingTimeout);
                loading.classList.add('hidden');

                if (cachedTasks.length === 0) {
                    taskList.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                } else {
                    sortAndRenderTasks();
                    taskList.classList.remove('hidden');
                    emptyState.classList.add('hidden');
                }
            } catch (err) { 
                if (loadingTimeout) clearTimeout(loadingTimeout);
                console.error(err); 
            } 
            finally {
                loading.classList.add('hidden');
            }
        }

        function sortAndRenderTasks() {
            cachedTasks.sort((a, b) => {
                const aImp = a.importance === 'high' ? 0 : 1;
                const bImp = b.importance === 'high' ? 0 : 1;
                if (aImp !== bImp) return aImp - bImp;
                if (a.due_date && !b.due_date) return -1;
                if (!a.due_date && b.due_date) return 1;
                if (a.due_date && b.due_date) return a.due_date.localeCompare(b.due_date);
                return 0;
            });
            renderTasks(cachedTasks);
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function renderTasks(tasks) {
            const container = document.getElementById('task-list');
            container.innerHTML = '';
            
            const activeTasks = tasks.filter(t => t.status !== 'completed');
            const completedTasks = tasks.filter(t => t.status === 'completed');
            
            // Sort completed tasks by completed_date_time DESC (with fallbacks)
            completedTasks.sort((a, b) => {
                const aTime = a.completed_date_time || a.last_modified_date_time || a.created_date_time || '';
                const bTime = b.completed_date_time || b.last_modified_date_time || b.created_date_time || '';
                return bTime.localeCompare(aTime);
            });

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const endOfWeek = new Date(today);
            const diff = 7 - (today.getDay() === 0 ? 7 : today.getDay());
            endOfWeek.setDate(today.getDate() + diff);
            endOfWeek.setHours(23, 59, 59, 999);

            activeTasks.forEach(task => {
                container.appendChild(createTaskCard(task, today, tomorrow, yesterday, endOfWeek));
            });

            // Show completed tasks only for individual lists
            if (completedTasks.length > 0 && currentListId && !currentListId.startsWith('group_')) {
                const hr = document.createElement('div');
                hr.className = 'my-4';
                container.appendChild(hr);

                const isCollapsed = localStorage.getItem(`completedCollapsed_${currentListId}`) === 'true';

                const header = document.createElement('div');
                header.className = 'flex items-center space-x-1.5 mb-0 px-4 py-2.5 cursor-pointer border-b border-[#E3E1DA]';
                header.onclick = () => {
                    const content = document.getElementById('completed-tasks-container');
                    const icon = document.getElementById('completed-toggle-icon');
                    const currentlyHidden = content.classList.toggle('hidden');
                    icon.classList.toggle('-rotate-90', currentlyHidden);
                    localStorage.setItem(`completedCollapsed_${currentListId}`, currentlyHidden);
                };
                header.innerHTML = `
                    <i id="completed-toggle-icon" class="fas fa-chevron-down text-[9px] text-[#9B9790] transition-transform ${isCollapsed ? '-rotate-90' : ''}"></i>
                    <span class="text-[12px] font-medium text-[#9B9790]">완료됨 (${completedTasks.length})</span>
                `;
                container.appendChild(header);

                const completedContainer = document.createElement('div');
                completedContainer.id = 'completed-tasks-container';
                completedContainer.className = `${isCollapsed ? 'hidden' : ''}`;
                completedTasks.forEach(task => {
                    completedContainer.appendChild(createTaskCard(task, today, tomorrow, yesterday, endOfWeek));
                });
                container.appendChild(completedContainer);
            }
        }

        function createTaskCard(task, today, tomorrow, yesterday, endOfWeek) {
            const card = document.createElement('div');
            card.id = `task-${task.id}`;

            const isImportant = task.importance === 'high';
            const isCompleted = task.status === 'completed';
            const dueDate = parseDate(task.due_date);

            const isToday    = dueDate && dueDate.getTime() === today.getTime();
            const isTomorrow = dueDate && dueDate.getTime() === tomorrow.getTime();
            const isYesterday= dueDate && dueDate.getTime() === yesterday.getTime();
            const isOverdue  = dueDate && dueDate.getTime() < today.getTime();

            let extraClass = '';
            if (!isCompleted) {
                if (isImportant)  extraClass = 'important-task';
                else if (isOverdue)  extraClass = 'overdue-task';
                else if (isToday)    extraClass = 'today-task';
                else if (isTomorrow) extraClass = 'tomorrow-task';
            }

            card.className = `group task-card px-4 py-2.5 flex flex-col ${extraClass} ${isCompleted ? 'opacity-60' : ''}`;

            const dateColor = isOverdue ? 'text-[#C04038]' : isToday ? 'text-[#367A52]' : isTomorrow ? 'text-[#3A6FBF]' : 'text-[#9B9790]';

            let subtasksHtml = '';
            if (task.subtasks && task.subtasks.length > 0) {
                subtasksHtml = `
                    <div class="mt-1.5 ml-7 space-y-1 border-l border-[#E3E1DA] pl-3 py-0.5">
                        ${task.subtasks.map(st => `
                            <div class="flex items-center space-x-2.5 group/sub min-w-0">
                                <input type="checkbox" ${st.isChecked ? 'checked' : ''}
                                       ${isCompleted ? 'disabled' : ''}
                                       onchange="toggleSubtask('${task.list_id}', '${task.id}', '${st.id}', this.checked, this)"
                                       class="w-3 h-3 rounded-sm border border-[#C8C5BC] cursor-pointer accent-[#C96442] flex-shrink-0">
                                <span class="flex-1 min-w-0 truncate text-[12px] ${st.isChecked ? 'line-through text-[#9B9790]' : 'text-[#5C5751] font-medium'} transition-all outline-none"
                                      ${isCompleted ? '' : 'contenteditable="true"'}
                                      onblur="updateSubtaskTitle('${task.list_id}', '${task.id}', '${st.id}', this)"
                                      onkeydown="if(event.key === 'Enter') { event.preventDefault(); this.blur(); }">
                                    ${st.displayName}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="flex items-center">
                    <div class="flex-shrink-0 mr-3">
                        <div class="relative w-4 h-4">
                            <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="completeTask('${task.list_id}', '${task.id}')"
                                   class="peer appearance-none w-4 h-4 rounded-sm border border-[#C8C5BC] hover:border-[#C96442] checked:bg-[#C96442] checked:border-[#C96442] transition-all cursor-pointer">
                            <i class="fas fa-check absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[7px] text-white opacity-0 peer-checked:opacity-100 pointer-events-none"></i>
                        </div>
                    </div>
                    <div class="flex-grow min-w-0 flex items-center justify-between">
                        <div class="flex items-center space-x-1.5 min-w-0 flex-1">
                            <h3 class="min-w-0 text-[13.5px] font-medium text-[#1A1917] outline-none truncate ${isCompleted ? 'line-through text-[#9B9790]' : ''}"
                                ${isCompleted ? '' : 'contenteditable="true"'}
                                onblur="updateTaskTitle('${task.list_id}', '${task.id}', this)"
                                onkeydown="if(event.key === 'Enter') { event.preventDefault(); this.blur(); }">
                                ${task.title}
                            </h3>
                            <button onclick="toggleImportance('${task.list_id}', '${task.id}', '${task.importance}')"
                                    ${isCompleted ? 'disabled' : ''}
                                    class="star-btn flex-shrink-0 focus:outline-none transition-all">
                                ${isImportant ?
                                    '<i class="fas fa-star text-[#A67530] text-xs"></i>' :
                                    '<i class="far fa-star text-[#A67530] text-xs opacity-0 group-hover:opacity-50 transition-opacity"></i>'}
                            </button>
                        </div>

                        <div class="flex-shrink-0 ml-3 flex items-center gap-1.5">
                            ${task.due_date ? `
                                <button onclick="${isCompleted ? '' : `showDueDateMenu(this, '${task.list_id}', '${task.id}', '${task.due_date}')`}" class="text-[11px] font-medium px-1.5 py-0.5 rounded hover:bg-[#F0EFE9] transition-all ${dateColor}">
                                    <i class="far fa-calendar mr-0.5 text-[10px] opacity-70"></i>${formatDate(task.due_date)}
                                </button>` : `
                                ${isCompleted ? '' : `
                                <button onclick="showDueDateMenu(this, '${task.list_id}', '${task.id}')" class="due-date-btn text-[10px] font-medium text-[#9B9790] hover:text-[#C96442] px-1.5 py-0.5 rounded border border-transparent hover:border-[#E3E1DA] transition-all">
                                    기한
                                </button>`}
                            `}
                            ${(!currentListId || currentListId.startsWith('group_')) && task.list_name ? `
                                <span class="px-1.5 py-0.5 bg-[#F0EFE9] text-[#9B9790] text-[10px] rounded hidden md:flex items-center whitespace-nowrap">
                                    ${task.list_name}
                                </span>
                            ` : ''}
                        </div>
                    </div>
                </div>
                ${subtasksHtml}
            `;
            return card;
        }

        async function setDueDate(listId, taskId, date) {
            try {
                const response = await fetch(`/api/tasks/${listId}/${taskId}/due`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ due_date: date })
                });
                if (response.ok) fetchTasks(true);
            } catch (err) { console.error(err); }
        }

        async function updateSubtaskTitle(listId, taskId, subtaskId, element) {
            const newTitle = element.innerText.trim();
            if (!newTitle) return;
            try {
                const response = await fetch(`/api/subtask/update/${listId}/${taskId}/${subtaskId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle })
                });
                if (!response.ok) throw new Error('Update failed');
            } catch (err) { console.error(err); alert('서브태스크 수정 중 오류가 발생했습니다.'); }
        }

        async function toggleSubtask(listId, taskId, subtaskId, checked, element) {
            const label = element.nextElementSibling;
            if (checked) {
                label.classList.add('line-through', 'text-slate-400', 'font-medium');
                label.classList.remove('text-slate-600', 'font-semibold');
            } else {
                label.classList.remove('line-through', 'text-slate-400', 'font-medium');
                label.classList.add('text-slate-600', 'font-semibold');
            }
            try {
                const response = await fetch(`/api/subtask/complete/${listId}/${taskId}/${subtaskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ checked: checked })
                });
                if (!response.ok) throw new Error('Update failed');
            } catch (err) {
                element.checked = !checked;
                toggleSubtask(listId, taskId, subtaskId, !checked, element);
                alert('서브태스크 업데이트 중 오류가 발생했습니다.');
            }
        }

        function formatDate(dateStr) {
            const d = parseDate(dateStr);
            if (!d) return '';
            
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            
            if (d.getTime() === today.getTime()) return '오늘';
            if (d.getTime() === tomorrow.getTime()) return '내일';
            if (d.getTime() === yesterday.getTime()) return '어제';
            
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dayName = days[d.getDay()];
            
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            
            return `${year}-${month}-${day} (${dayName})`;
        }

        async function addTask() {
            const input = document.getElementById('task-input');
            const title = input.value.trim();
            if (!title || isProcessing || !currentListId || currentListId.startsWith('group_')) return;
            isProcessing = true;
            input.disabled = true;
            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title, list_id: currentListId })
                });
                if (response.ok) { input.value = ''; await fetchTasks(); }
            } finally { isProcessing = false; updateTaskInputState(); input.focus(); }
        }

        async function completeTask(listId, taskId) {
            const card = document.getElementById(`task-${taskId}`);
            const isCurrentlyCompleted = card.classList.contains('opacity-60');
            
            if (!isCurrentlyCompleted) {
                card.classList.add('completed', 'fade-out');
            } else {
                card.classList.remove('opacity-60');
            }

            try {
                const resp = await fetch(`/api/complete/${listId}/${taskId}`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                if (resp.ok) {
                    if (!isCurrentlyCompleted) {
                        setTimeout(() => fetchTasks(true), 400);
                    } else {
                        fetchTasks(true);
                    }
                } else { throw new Error('Fail'); }
            } catch (err) { 
                fetchTasks(true);
            }
        }

        async function updateTaskTitle(listId, taskId, element) {
            const newTitle = element.innerText.trim();
            if (!newTitle) return;
            try {
                await fetch(`/api/tasks/${listId}/${taskId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle })
                });
            } catch (err) { console.error(err); }
        }

        async function toggleImportance(listId, taskId, currentImportance) {
            const newImportance = currentImportance === 'high' ? 'normal' : 'high';
            const taskIndex = cachedTasks.findIndex(t => t.id === taskId);
            if (taskIndex !== -1) {
                cachedTasks[taskIndex].importance = newImportance;
                sortAndRenderTasks();
            }
            try {
                const response = await fetch(`/api/tasks/${listId}/${taskId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ importance: newImportance })
                });
                if (!response.ok) throw new Error('Fail');
            } catch (err) {
                if (taskIndex !== -1) {
                    cachedTasks[taskIndex].importance = currentImportance;
                    sortAndRenderTasks();
                }
            }
        }

        function initClock() {
            function updateClock() {
                const now = new Date();
                const days = ['일', '월', '화', '수', '목', '금', '토'];
                const month = now.getMonth() + 1;
                const date = now.getDate();
                const day = days[now.getDay()];
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const timeString = `${month}월 ${date}일 (${day}) ${hours}:${minutes}:${seconds}`;

                const desktopClock = document.getElementById('desktop-clock');
                const mobileClock = document.getElementById('mobile-clock');
                if (desktopClock) desktopClock.innerText = timeString;
                if (mobileClock) mobileClock.innerText = timeString;

                const wTime = document.getElementById('widget-time');
                const wDate = document.getElementById('widget-date');
                if (wTime) wTime.textContent = `${hours}:${minutes}:${seconds}`;
                if (wDate) wDate.textContent = `${month}월 ${date}일 (${day})`;
            }
            setInterval(updateClock, 1000);
            updateClock();
        }

        function initBackgroundBySun() {
            // Background animation setting is no longer used (flat design)
        }

        async function initWeatherEffect() {
            const weatherEffect = localStorage.getItem('weatherEffect') !== 'false';
            const layer = document.getElementById('weather-layer');
            const sunGlare = layer.querySelector('.sun-glare');
            const cloudOverlay = layer.querySelector('.cloud-overlay');
            const mistOverlay = layer.querySelector('.mist-overlay');
            
            // Clear existing particles
            layer.querySelectorAll('.rain, .snow, .sparkle').forEach(el => el.remove());
            sunGlare.classList.remove('active');
            cloudOverlay.classList.remove('active', 'heavy');
            mistOverlay.classList.remove('active');
            if (window.thunderInterval) clearInterval(window.thunderInterval);

            if (!weatherEffect) return;

            try {
                const resp = await fetch('https://wttr.in/Seoul?format=j1');
                const data = await resp.json();
                const condition = data.current_condition[0];
                const code = parseInt(condition.weatherCode);

                // Weather Code Groups (WWO)
                const clearCodes = [113];
                const partlyCloudyCodes = [116];
                const cloudyCodes = [119, 122];
                const mistCodes = [143, 248, 260];
                const rainCodes = [176, 263, 266, 293, 296, 299, 302, 305, 308, 353, 356, 359];
                const snowCodes = [179, 227, 230, 323, 326, 329, 332, 335, 338, 368, 371, 392, 395];
                const thunderCodes = [200, 386, 389];

                if (thunderCodes.includes(code)) {
                    createParticles('storm-rain', 60);
                    cloudOverlay.classList.add('active', 'heavy');
                    initThunder();
                } else if (rainCodes.includes(code)) {
                    createParticles('rain', 70);
                    cloudOverlay.classList.add('active', 'heavy');
                } else if (snowCodes.includes(code)) {
                    createParticles('snow', 55);
                    cloudOverlay.classList.add('active', 'heavy');
                } else if (mistCodes.includes(code)) {
                    mistOverlay.classList.add('active');
                } else if (cloudyCodes.includes(code)) {
                    cloudOverlay.classList.add('active', 'heavy');
                } else if (partlyCloudyCodes.includes(code)) {
                    cloudOverlay.classList.add('active');
                } else if (clearCodes.includes(code)) {
                    sunGlare.classList.add('active');
                    createSparkles(30);
                }

                // Update side widget
                const iconMap = {
                    clear: '☀️', partly: '⛅', cloudy: '☁️',
                    mist: '🌫️', rain: '🌧️', snow: '❄️', thunder: '⛈️'
                };
                let wType = 'partly';
                if (thunderCodes.includes(code)) wType = 'thunder';
                else if (rainCodes.includes(code)) wType = 'rain';
                else if (snowCodes.includes(code)) wType = 'snow';
                else if (mistCodes.includes(code)) wType = 'mist';
                else if (cloudyCodes.includes(code)) wType = 'cloudy';
                else if (clearCodes.includes(code)) wType = 'clear';

                const descMap = { clear: '맑음', partly: '구름 조금', cloudy: '흐림', mist: '안개', rain: '비', snow: '눈', thunder: '폭풍' };
                const wIcon = document.getElementById('widget-icon');
                const wTemp = document.getElementById('widget-temp');
                const wDesc = document.getElementById('widget-desc');
                if (wIcon) wIcon.textContent = iconMap[wType];
                if (wTemp) wTemp.textContent = `${condition.temp_C}°C`;
                if (wDesc) wDesc.textContent = descMap[wType];
            } catch (err) {
                console.error('Weather fetch failed', err);
                const wDesc = document.getElementById('widget-desc');
                if (wDesc) wDesc.textContent = '날씨 정보 없음';
            }
        }

        function createSparkles(count) {
            const layer = document.getElementById('weather-layer');
            for (let i = 0; i < count; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                const size = Math.random() * 3 + 1 + 'px';
                s.style.width = size; s.style.height = size;
                s.style.left = Math.random() * 100 + 'vw';
                s.style.top = Math.random() * 100 + 'vh';
                s.style.animationDelay = Math.random() * 5 + 's';
                layer.appendChild(s);
            }
        }

        function initThunder() {
            const flash = document.querySelector('.thunder-flash');
            window.thunderInterval = setInterval(() => {
                if (Math.random() > 0.6) {
                    flash.classList.add('flash-active');
                    setTimeout(() => flash.classList.remove('flash-active'), 700);
                }
            }, 3000);
        }

        function createParticles(type, count) {
            const layer = document.getElementById('weather-layer');
            const stormAnims = ['fall-storm-1', 'fall-storm-2', 'fall-storm-3'];
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = type;
                p.style.left = Math.random() * 110 + 'vw';
                const isRainType = type === 'rain' || type === 'storm-rain';
                p.style.animationDuration = (Math.random() * 0.8 + (isRainType ? 0.4 : 2)) + 's';
                p.style.animationDelay = (Math.random() * 3 - 1) + 's';
                if (type === 'storm-rain') {
                    p.style.animationName = stormAnims[Math.floor(Math.random() * 3)];
                }
                if (type === 'snow') {
                    const size = Math.random() * 5 + 3 + 'px';
                    p.style.width = size;
                    p.style.height = size;
                    p.style.opacity = Math.random() * 0.5 + 0.5;
                }
                layer.appendChild(p);
            }
        }

        function initEyeTracking() {
            document.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX;
                const mouseY = e.clientY;

                const eyes = document.querySelectorAll('.eye');
                eyes.forEach(eye => {
                    const rect = eye.getBoundingClientRect();
                    const eyeX = rect.left + rect.width / 2;
                    const eyeY = rect.top + rect.height / 2;

                    const angle = Math.atan2(mouseY - eyeY, mouseX - eyeX);
                    const distance = Math.min(rect.width / 4, rect.height / 4); // max distance pupil can move

                    const pupilX = Math.cos(angle) * distance;
                    const pupilY = Math.sin(angle) * distance;

                    const pupil = eye.querySelector('.pupil');
                    if (pupil) {
                        pupil.style.transform = `translate(calc(-50% + ${pupilX}px), calc(-50% + ${pupilY}px))`;
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchLists();
            initClock();
            initBackgroundBySun();
            initWeatherEffect();
            initEyeTracking();
            setInterval(initBackgroundBySun, 10 * 60 * 1000);
            setInterval(initWeatherEffect, 30 * 60 * 1000); // Update weather every 30 mins
        });    </script>
