<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Microsoft To Do</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="할 일">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg: #F7F6F2;
            --surface: #FFFFFF;
            --border: #E3E1DA;
            --text-1: #1A1917;
            --text-2: #5C5751;
            --text-3: #9B9790;
            --accent: #C96442;
            --accent-hover: #B55A38;
            --red: #C04038;
            --red-bg: #FAEAEA;
            --green: #367A52;
            --green-bg: #EAF4EF;
        }
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--bg);
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-full bg-[var(--accent)] text-white flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check text-lg"></i>
            </div>
            <h1 class="text-xl font-bold text-[var(--text-1)]">MS To Do Helper</h1>
            <p class="text-[var(--text-3)] text-[13px] mt-1">Microsoft To Do 대시보드에 로그인하세요</p>
        </div>

        <div class="bg-[var(--surface)] border border-[var(--border)]">
            <form method="POST" class="p-6 space-y-4">
                {% if error %}
                <div class="flex items-center gap-2 px-3 py-2.5 bg-[var(--red-bg)] text-[var(--red)] text-[12px] font-medium border border-[#F0C9C6]">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>{{ error }}</span>
                </div>
                {% elif info %}
                <div class="flex items-center gap-2 px-3 py-2.5 bg-[var(--green-bg)] text-[var(--green)] text-[12px] font-medium border border-[#C5E4D2]">
                    <i class="fas fa-check-circle"></i>
                    <span>{{ info }}</span>
                </div>
                {% endif %}
                <div>
                    <label for="username" class="block text-[11px] font-semibold text-[var(--text-3)] mb-1.5 uppercase tracking-wider">아이디</label>
                    <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" autofocus
                           class="w-full px-3 py-2.5 bg-[var(--bg)] border border-[var(--border)] focus:border-[var(--accent)] outline-none transition-colors text-[13px] text-[var(--text-1)]"
                           placeholder="아이디" required>
                </div>
                <div>
                    <label for="password" class="block text-[11px] font-semibold text-[var(--text-3)] mb-1.5 uppercase tracking-wider">비밀번호</label>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                           class="w-full px-3 py-2.5 bg-[var(--bg)] border border-[var(--border)] focus:border-[var(--accent)] outline-none transition-colors text-[13px] text-[var(--text-1)]"
                           placeholder="비밀번호" required>
                </div>
                <button type="submit"
                        class="w-full px-5 py-2.5 bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white font-medium text-[13px] transition-colors">
                    로그인
                </button>
            </form>
        </div>

        <div class="mt-8 text-center">
            <p class="text-[11px] font-medium text-[var(--text-3)] uppercase tracking-widest">
                &copy; 2026 MS To Do Helper
            </p>
        </div>
    </div>
</body>
</html>
